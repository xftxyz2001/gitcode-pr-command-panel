<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitCode PR 快捷命令设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">GitCode PR 快捷命令</p>
        <h1>配置悬浮面板</h1>
        <p class="intro">配置命令按钮与面板外观，保存后会同步应用到所有已打开的 GitCode PR 页面。</p>
      </div>
      <div class="header-actions">
        <button id="reset-button" class="button secondary" type="button">恢复默认</button>
        <button id="save-button" class="button primary" type="button">保存配置</button>
      </div>
    </header>

    <section class="summary-card" aria-label="默认配置说明">
      <div>
        <strong>默认显示</strong>
        <span>compile、get-log、/lgtm、/approve</span>
      </div>
      <p>默认命令来自 Ascend 社区机器人使用指南；参数化命令使用指南中的示例值，启用前请按仓库实际标签修改。</p>
    </section>

    <section class="appearance-card" aria-labelledby="appearance-title">
      <div class="section-heading">
        <div>
          <h2 id="appearance-title">外观</h2>
          <p>文字色及按钮交互色会根据所选颜色自动生成，保证普通、悬停和按下状态清晰可辨。</p>
        </div>
        <button id="clear-background-button" class="button secondary compact" type="button">清除背景图片</button>
      </div>
      <div class="appearance-layout">
        <div class="appearance-controls">
          <label class="appearance-field">
            <span>命令按钮颜色</span>
            <span class="color-control">
              <input id="button-color" type="color" value="#ffffff">
              <output id="button-color-value" for="button-color">#ffffff</output>
            </span>
          </label>
          <label class="appearance-field">
            <span>面板背景色</span>
            <span class="color-control">
              <input id="panel-background-color" type="color" value="#ffffff">
              <output id="panel-background-color-value" for="panel-background-color">#ffffff</output>
            </span>
          </label>
          <label class="appearance-field file-field">
            <span>面板背景图片</span>
            <input id="background-image" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif">
            <span id="background-image-status" class="field-help">未选择图片，最大 2 MB</span>
          </label>
          <label class="appearance-field">
            <span>图片显示方式</span>
            <select id="background-image-fit">
              <option value="cover">覆盖面板（Cover）</option>
              <option value="contain">完整包含（Contain）</option>
              <option value="center">原始大小居中</option>
            </select>
          </label>
          <label class="appearance-field">
            <span>背景图片淡化程度 <output id="background-overlay-value" for="background-overlay-opacity">72%</output></span>
            <input id="background-overlay-opacity" type="range" min="0" max="100" step="1" value="72">
            <span class="field-help">数值越高，背景图片越淡，面板文字越容易看清。</span>
          </label>
        </div>
        <div class="appearance-preview-wrap">
          <span class="preview-label">实时预览</span>
          <section id="appearance-preview" class="appearance-preview" aria-label="悬浮面板外观预览">
            <div class="preview-header">
              <strong>PR 快捷命令</strong>
              <span>⚙ &nbsp;−</span>
            </div>
            <div class="preview-grid">
            </div>
            <p id="appearance-preview-status">正在读取已启用命令…</p>
          </section>
        </div>
      </div>
    </section>

    <section class="commands-card">
      <div class="table-head" aria-hidden="true">
        <span>显示</span>
        <span>按钮名称</span>
        <span>发送内容</span>
        <span>顺序</span>
        <span></span>
      </div>
      <div id="command-list" class="command-list"></div>
      <button id="add-button" class="add-button" type="button">＋ 添加其他命令</button>
    </section>

    <footer class="page-footer">
      <span id="save-status" role="status" aria-live="polite">修改后请保存</span>
      <div class="footer-links">
        <a href="mock.html" target="_blank">测试流水线通知</a>
        <a href="https://gitcode.com/Ascend/infrastructure/blob/master/docs/robot/robot%E4%BD%BF%E7%94%A8%E6%8C%87%E5%8D%97.md" target="_blank" rel="noreferrer">查看机器人命令指南</a>
      </div>
    </footer>
  </main>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <form method="dialog" class="confirm-card">
      <div class="confirm-icon" aria-hidden="true">!</div>
      <div class="confirm-content">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-message"></p>
      </div>
      <div class="confirm-actions">
        <button class="button secondary" type="submit" value="cancel">取消</button>
        <button id="confirm-action-button" class="button danger" type="submit" value="confirm">确认</button>
      </div>
    </form>
  </dialog>

  <template id="command-row-template">
    <article class="command-row" draggable="true">
      <label class="toggle-wrap">
        <input class="enabled-input" type="checkbox">
        <span class="toggle-ui" aria-hidden="true"></span>
        <span class="sr-only">显示此命令</span>
      </label>
      <label>
        <span class="mobile-label">按钮名称</span>
        <input class="label-input text-input" type="text" maxlength="30" placeholder="例如：编译">
      </label>
      <label>
        <span class="mobile-label">发送内容</span>
        <input class="command-input text-input code-input" type="text" maxlength="65535" placeholder="例如：compile">
      </label>
      <div class="order-actions">
        <button class="icon-button move-up" type="button" title="上移" aria-label="上移">↑</button>
        <button class="icon-button move-down" type="button" title="下移" aria-label="下移">↓</button>
        <button class="drag-handle" type="button" title="拖动排序" aria-label="拖动排序">⋮⋮</button>
      </div>
      <button class="icon-button delete-button" type="button" title="删除" aria-label="删除">×</button>
    </article>
  </template>

  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
